# Builds the book on every push to main and publishes it to GitHub Pages, so
# the generated site is never committed. Pages has to be set to deploy from
# "GitHub Actions" (Settings → Pages → Source) for the deploy job to work.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels the build of an older one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The version the site was first built with. Bumping it is a deliberate
  # change: mdBook's output changes between versions.
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/configure-pages@v6
      - run: mdbook build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
